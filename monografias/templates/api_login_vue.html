<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - API Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #app {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 3rem 2rem;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 0.5rem;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .login-header h1 {
            font-size: 1.8rem;
            color: #333;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .login-header p {
            color: #666;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-group input {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }

        .input-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #667eea;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 1rem;
            cursor: pointer;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .alert {
            padding: 0.75rem;
            border-radius: 8px;
            border-left: 4px solid;
            margin-bottom: 1.5rem;
            animation: slideInDown 0.3s ease;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border-color: #dc3545;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-color: #28a745;
        }

        .loading-spinner {
            display: inline-block;
            text-align: center;
        }

        .spinner-border {
            color: #667eea;
        }

        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e0e0e0;
        }

        .login-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        .demo-info {
            background: #e7f3ff;
            padding: 1rem;
            border-radius: 8px;
            border-left: 4px solid #2196F3;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #0c5c8a;
            animation: slideInDown 0.3s ease;
        }

        .form-group.focused label {
            color: #667eea;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }

            .login-header i {
                font-size: 2.5rem;
            }
        }

        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s;
        }

        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-container">
            <div class="login-header">
                <i class="fas fa-chart-line"></i>
                <h1>Dashboard Monografias</h1>
                <p>API Monografias UFVJM</p>
            </div>

            <!-- Mensagens -->
            <transition name="fade">
                <div v-if="erro" class="alert alert-error">
                    <i class="fas fa-exclamation-circle"></i>
                    {{ erro }}
                </div>
            </transition>

            <transition name="fade">
                <div v-if="sucesso" class="alert alert-success">
                    <i class="fas fa-check-circle"></i>
                    {{ sucesso }}
                </div>
            </transition>

            {% comment %} <!-- Info de Demo -->
            <div class="demo-info">
                <i class="fas fa-info-circle"></i>
                <strong>Demo:</strong> Use suas credenciais de usuário para acessar o dashboard
            </div> {% endcomment %}

            <!-- Formulário -->
            <form @submit.prevent="fazerLogin">
                <div class="form-group" :class="{ focused: usuarioFocado }">
                    <label for="username">
                        <i class="fas fa-user"></i> Usuário
                    </label>
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="username" 
                            class="form-control"
                            v-model="usuario"
                            @focus="usuarioFocado = true"
                            @blur="usuarioFocado = false"
                            placeholder="Digite seu usuário"
                            required
                            autocomplete="username"
                            :disabled="carregando"
                        >
                        <i class="fas fa-check input-icon" v-if="usuario" style="color: #28a745;"></i>
                    </div>
                </div>

                <div class="form-group" :class="{ focused: senhaFocada }">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="input-wrapper">
                        <input 
                            :type="mostrarSenha ? 'text' : 'password'"
                            id="password" 
                            class="form-control"
                            v-model="senha"
                            @focus="senhaFocada = true"
                            @blur="senhaFocada = false"
                            placeholder="Digite sua senha"
                            required
                            autocomplete="current-password"
                            :disabled="carregando"
                        >
                        <i 
                            class="fas input-icon"
                            :class="mostrarSenha ? 'fa-eye-slash' : 'fa-eye'"
                            @click="mostrarSenha = !mostrarSenha"
                            style="cursor: pointer;"
                        ></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" :disabled="carregando">
                    <div v-if="carregando" class="loading-spinner">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span class="ms-2">Autenticando...</span>
                    </div>
                    <div v-else>
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </div>
                </button>
            </form>

            <div class="login-footer">
                <p>
                    <i class="fas fa-lock"></i>
                    Token salvo com segurança no navegador
                </p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    usuario: '',
                    senha: '',
                    mostrarSenha: false,
                    usuarioFocado: false,
                    senhaFocada: false,
                    carregando: false,
                    erro: null,
                    sucesso: null,
                    API_URL: 'http://localhost:8000/api'
                }
            },
            methods: {
                async fazerLogin() {
                    // Reset de mensagens
                    this.erro = null;
                    this.sucesso = null;

                    // Validação
                    if (!this.usuario || !this.senha) {
                        this.erro = 'Usuário e senha são obrigatórios';
                        return;
                    }

                    this.carregando = true;

                    try {
                        const response = await fetch(`${this.API_URL}/token/`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                username: this.usuario,
                                password: this.senha
                            })
                        });

                        const dados = await response.json();

                        if (!response.ok) {
                            throw new Error(dados.error || 'Erro ao fazer login');
                        }

                        // Salva token e nome
                        localStorage.setItem('token', dados.token);
                        localStorage.setItem('userName', dados.username);

                        // Mensagem de sucesso
                        this.sucesso = 'Login realizado com sucesso! Redirecionando...';

                        setTimeout(() => {
                            window.location.href = '/api-dashboard-vue/';
                        }, 1000);

                    } catch (erro) {
                        console.error('Erro:', erro);
                        this.erro = erro.message;
                    } finally {
                        this.carregando = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
